[package]
name = "vlsync-atproto"
version = "0.1.0"
edition = "2021"
description = "atproto for vlsync servers: DAG-CBOR, CIDs, TIDs, CARs, the MST, K-256 signing, firehose frames, PLC operations, DID resolution and the SSRF-guarded HTTP clients it uses, and XRPC errors"
license = "MIT"
publish = false

[features]
# TEST ONLY: tid::set_test_skew_us, a per-thread shift of the wall clock
# tid::now_micros reads (a backward NTP step in tests)
test-clock = []

[dependencies]
vlsync-store = { path = "../vlsync-store" }
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros", "http2"] }
base64 = "0.23"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
hex = "0.4"
parking_lot = "0.12"
prometheus = { version = "0.14", default-features = false }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "http2", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
# K-256 signing/verification: libsecp256k1 (vendored C via cc), ~1.7x
# faster signing and ~2.7x faster verification than RustCrypto k256.
secp256k1 = { version = "0.33", features = ["global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
# tests cross-check libsecp256k1 signatures against RustCrypto
k256 = { version = "0.14", features = ["ecdsa"] }
