[package]
name = "vlsync-lease"
version = "0.1.0"
edition = "2021"
description = "Ownership with safety in the bucket and pluggable liveness: typed CAS on JSON objects, epoch records and their fences, an assignment table over slot ranges with spans, replicas and a published topology, and liveness by bucket leases or peer heartbeats"
license = "MIT"
publish = false

[features]
# `chaos::ChaosStore`, an object store that injects latency, errors and
# lost answers, for users' own tests
chaos = ["dep:rand"]

[dependencies]
vlsync-store = { path = "../vlsync-store" }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
object_store = { version = "0.14", features = ["aws"] }
parking_lot = "0.12"
rand = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
rand = "0.8"
tokio = { version = "1", features = ["full", "test-util"] }
