[package]
name = "vlsync-slatedb"
version = "0.1.0"
edition = "2021"
description = "The SlateDB fork every vlsync user builds against, pinned in one place"
license = "MIT"
publish = false

# Users depend on this under the name `slatedb`:
#   slatedb = { package = "vlsync-slatedb", path = "../vlsync/crates/vlsync-slatedb" }
# so their code keeps writing `slatedb::...` and no workspace needs a
# [patch.crates-io] of its own.
#
# The fork's main = upstream slatedb main at 8c1c6c33 plus the patches listed
# in its PATCHES.md (numbered as there), pinned here by rev (each patch also
# has its own branch for an upstream report, all pending). Upstream fixes
# the two union-clone bugs behind vlpds partition.rs's merge regression tests
# (#2132: unique L0 view ids after a split's halves merge back; #2134: the
# writer/compactor L0 merge cuts at the view id, not a shared SST id), so the
# fork's patches 1 and 5 are gone. vlpds DESIGN.md "Online shard
# split/merge", "Patched SlateDB".
# 2. a synchronous `next` fast path for resident rows plus DbIterator::next_batch
#    (scan ~12.5k -> ~3.4k instructions/row; getRepo export -57%).
# 3. an admin-submitted compaction (reshard GC's forced detach) skipped the
#    destination check and could be promoted next to a running job into the
#    same sorted run; the executor's assert! then panicked (validate_compaction
#    now fails a submitted spec that collides with a claimed one).
# 4. CompactionWorkerBuilder::with_db_cache: a standalone worker seeds its
#    output SSTs' index and filters into the DB's cache, so a fresh SST isn't
#    a guaranteed metadata miss for its first reads.
# 6. the table store peeks the cache (DbCache::peek_*) before it builds a
#    CacheLoader: every filter/index/stats/block hit built and dropped one,
#    ~10 allocations per SST section a get touches (~16% fewer instructions
#    per cached get in the fork's alloc bench). MetaCache and BlockCache use
#    the default peek, their get_*.
# 7. SafeSender: a send into a channel whose receiving task was dropped
#    without a recorded close result (a runtime shut down under an open DB)
#    returns BackgroundTaskCancelled instead of panicking.
# 8. SplitCache::fetch_block/fetch_index clamp the loaded entry to its own
#    allocation, as insert does: an uncompressed block was a slice of the
#    HTTP read buffer and pinned all of it (vlRelay's seeds: ~1 GB uncounted).
# 9. DbCache::weighted_size/split_weighted_size (bytes held, block vs meta
#    for SplitCache) and a real FoyerCache::entry_count, for
#    slatedb_cache_bytes / slatedb_cache_entries.
[dependencies]
# zstd/lz4: SST block compression (vlpds --sst-compression, default zstd)
slatedb = { git = "https://github.com/jazware/slatedb", rev = "87db9e3b3f5ba8d0473deb240990e33cb5e50208", features = ["aws", "wal_disable", "zstd", "lz4"] }
# the same rev, so slate-metrics' recorder and slatedb share one slatedb-common
slatedb-common = { git = "https://github.com/jazware/slatedb", rev = "87db9e3b3f5ba8d0473deb240990e33cb5e50208" }
